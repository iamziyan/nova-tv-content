name: update-content
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 update_content.py
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
      - run: |
          git config user.name "nova-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content.json
          git diff --cached --quiet || (git commit -m "update content" && git push)
